    user-drag: none;

<script>
/**
 * WRGSMK Core JavaScript Framework
 * Modulare Basis für alle Webflow-Seiten
 * Version: 2.1
 */

// ===== CORE CONFIGURATION =====
const WRGSMK_CONFIG = {
  // Custom Easings
  CUSTOM_EASINGS: {
    naturalInOut: "M0,0 C0.19,0.03 0.32,0.27 0.5,0.5 0.68,0.73 0.83,0.97 1,1",
    lightFall: "M0,0 C0.2,0 0.3,0.3 0.5,0.6 0.7,0.9 0.8,1.0 1.0,1.0",
    hover266: "M0,0 C0.83,0 0.17,1 1,1"
  },

  SCROLL_SMOOTH: {
    SMOOTH: 0.8,
    TOUCH: 0.2
  }
};

// ===== CORE STATE MANAGEMENT =====
const WRGSMK_STATE = {
  isInitialized: false,
  eventListeners: [],
  smoother: null,
  hasScrolled: false,
  domCache: {}
};

// ===== UTILITY FUNCTIONS =====
const WRGSMK_UTILS = {
  getElement: (selector, useCache = true) => {
    if (useCache && WRGSMK_STATE.domCache[selector]) {
      return WRGSMK_STATE.domCache[selector];
    }
    const element = document.querySelector(selector);
    if (useCache) WRGSMK_STATE.domCache[selector] = element;
    return element;
  },

  getElements: (selector, useCache = true) => {
    if (useCache && WRGSMK_STATE.domCache[selector]) {
      return WRGSMK_STATE.domCache[selector];
    }
    const elements = document.querySelectorAll(selector);
    if (useCache) WRGSMK_STATE.domCache[selector] = elements;
    return elements;
  },

  addManagedEventListener: (element, event, handler, options = {}) => {
    if (!element) return;
    
    element.addEventListener(event, handler, options);
    WRGSMK_STATE.eventListeners.push({ element, event, handler, options });
  },

  debounce: (func, wait) => {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }
};

// ===== CORE MODULES =====
const WRGSMK_CORE = {
  
  setupGSAP: () => {
    try {
      if (typeof gsap === 'undefined') {
        return false;
      }

      gsap.registerPlugin(ScrollTrigger, ScrollSmoother, CustomEase);
      
      Object.entries(WRGSMK_CONFIG.CUSTOM_EASINGS).forEach(([name, curve]) => {
        CustomEase.create(name, curve);
      });

      return true;
    } catch (error) {
      console.error('GSAP setup failed:', error);
      return false;
    }
  },

  initScrollSmoother: () => {
    try {
      WRGSMK_STATE.smoother = ScrollSmoother.create({
        smooth: WRGSMK_CONFIG.SCROLL_SMOOTH.SMOOTH,
        effects: true,
        smoothTouch: WRGSMK_CONFIG.SCROLL_SMOOTH.TOUCH,
        normalizeScroll: true,
        ignoreMobileResize: true
      });
      return true;
    } catch (error) {
      console.error('ScrollSmoother initialization failed:', error);
      return false;
    }
  },

  setupCoreEventListeners: () => {
    WRGSMK_UTILS.addManagedEventListener(window, 'beforeunload', WRGSMK_CORE.cleanup);
    
    WRGSMK_UTILS.addManagedEventListener(document, 'visibilitychange', () => {
      if (document.hidden) {
        gsap.globalTimeline.pause();
      } else {
        gsap.globalTimeline.resume();
      }
    });
  },

  cleanup: () => {
    try {
      if (WRGSMK_STATE.smoother && typeof WRGSMK_STATE.smoother.kill === 'function') {
        WRGSMK_STATE.smoother.kill();
      }

      WRGSMK_STATE.eventListeners.forEach(({ element, event, handler }) => {
        element.removeEventListener(event, handler);
      });
      WRGSMK_STATE.eventListeners = [];

      Object.keys(WRGSMK_STATE.domCache).forEach(key => delete WRGSMK_STATE.domCache[key]);

      document.body.classList.remove('no-scroll');

      // Cleanup Module Components
      if (window.WRGSMK_HORIZONTAL_SCROLL) {
        window.WRGSMK_HORIZONTAL_SCROLL.destroy();
      }
      if (window.WRGSMK_IMG_GRID) {
        window.WRGSMK_IMG_GRID.destroy();
      }
      if (window.WRGSMK_FANCY_VERT) {
        window.WRGSMK_FANCY_VERT.destroy();
      }

    } catch (error) {
      console.error('Cleanup failed:', error);
    }
  }
};

// ===== MAIN INITIALIZATION FUNCTION =====
window.WRGSMK_INIT = async function(pageConfig = {}) {
  if (WRGSMK_STATE.isInitialized) return;

  try {
    const gsapReady = WRGSMK_CORE.setupGSAP();
    if (!gsapReady) {
      throw new Error('GSAP initialization failed');
    }

    const SELECTORS = { ...pageConfig.selectors };

    // Initialize Preloader
    if (window.WRGSMK_PRELOADER) {
      await window.WRGSMK_PRELOADER.init();
    }

    // Initialize ScrollSmoother
    WRGSMK_CORE.initScrollSmoother();

    // Initialize Module Components
    if (window.WRGSMK_HORIZONTAL_SCROLL) {
      window.WRGSMK_HORIZONTAL_SCROLL.init();
    }
    if (window.WRGSMK_IMG_GRID) {
      window.WRGSMK_IMG_GRID.init();
    }
    if (window.WRGSMK_FANCY_VERT) {
      window.WRGSMK_FANCY_VERT.init();
    }

    WRGSMK_CORE.setupCoreEventListeners();

    if (pageConfig.init && typeof pageConfig.init === 'function') {
      pageConfig.init(SELECTORS, WRGSMK_CORE, WRGSMK_UTILS, WRGSMK_STATE);
    }

    WRGSMK_STATE.isInitialized = true;
    
    window.dispatchEvent(new CustomEvent('wrgsmkReady', {
      detail: { 
        timestamp: Date.now(),
        version: '2.1',
        page: pageConfig.pageName || 'unknown'
      }
    }));

  } catch (error) {
    console.error('WRGSMK initialization failed:', error);
  }
};

document.addEventListener("DOMContentLoaded", () => {
  if (!window.WRGSMK_PAGE_CONFIG) {
    window.WRGSMK_INIT();
  }
});

window.WRGSMK = {
  CORE: WRGSMK_CORE,
  UTILS: WRGSMK_UTILS,
  STATE: WRGSMK_STATE,
  CONFIG: WRGSMK_CONFIG,
  INIT: window.WRGSMK_INIT
};

</script>

<script>
/**
 * WRGSMK Preloader Module
 * Standalone preloader functionality
 */

window.WRGSMK_PRELOADER = {
  
  SELECTORS: {
    PRELOADER: '.wrgsmk-preloader',
    PRELOADER_BG: '.preloader-bg',
    PRELOADER_GIF: '.preloader-gif'
  },

  CONFIG: {
    DELAY: 500,
    BG_DURATION: 1,
    GIF_DURATION: 0.5
  },

  init: function() {
    return new Promise((resolve) => {
      const preloader = document.querySelector(this.SELECTORS.PRELOADER);
      const preloaderBg = document.querySelector(this.SELECTORS.PRELOADER_BG);
      const preloaderGif = document.querySelector(this.SELECTORS.PRELOADER_GIF);
      const body = document.body;

      if (!preloader) {
        resolve();
        return;
      }

      body.classList.add('no-scroll');
      if (preloaderBg) gsap.set(preloaderBg, { mixBlendMode: "normal" });

      const handleLoad = () => {
        setTimeout(() => {
          const tl = gsap.timeline({
            onComplete: () => {
              gsap.set(preloader, { display: 'none' });
              body.classList.remove('no-scroll');
              window.scrollTo(0, 0);
              window.dispatchEvent(new CustomEvent('wrgsmkPreloaderComplete'));
              resolve();
            }
          });

          if (preloaderBg) {
            tl.to(preloaderBg, {
              scale: 0,
              marginTop: '-100%',
              duration: this.CONFIG.BG_DURATION,
              ease: 'naturalInOut'
            }, 0);
          }

          if (preloaderGif) {
            tl.to(preloaderGif, {
              scale: 0,
              y: -100,
              duration: this.CONFIG.GIF_DURATION,
              ease: 'power3.in'
            }, 0);
          }
        }, this.CONFIG.DELAY);
      };

      if (document.readyState === 'complete') {
        handleLoad();
      } else {
        window.addEventListener('load', handleLoad, { once: true });
      }

      window.addEventListener('beforeunload', () => {
        body.classList.remove('no-scroll');
      });
    });
  }
};
</script>

<script>
/**
 * WRGSMK Image Grid Module
 * Standalone image grid functionality
 */

window.WRGSMK_IMG_GRID = {
  
  SELECTORS: {
    IMG_GRID: '.zag_img-grid--img-container',
    IMAGES: '.zag_img-grid--img-container img'
  },

  CONFIG: {
    OBSERVER_THRESHOLD: 0.1
  },

  state: {
    observer: null,
    processedElements: new Set()
  },

  setupIntersectionObserver: function() {
    if (!window.IntersectionObserver) return;

    this.state.observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !this.state.processedElements.has(entry.target)) {
          this.processImage(entry.target);
          this.state.processedElements.add(entry.target);
        }
      });
    }, {
      threshold: this.CONFIG.OBSERVER_THRESHOLD,
      rootMargin: '50px'
    });
  },

  processImage: function(img) {
    // Image is now visible - ready for any future processing
    // No animation applied
  },

  init: function() {
    const images = document.querySelectorAll(this.SELECTORS.IMAGES);
    
    if (images.length === 0) return;

    this.setupIntersectionObserver();

    if (this.state.observer) {
      images.forEach(img => {
        this.state.observer.observe(img);
      });
    }
  },

  destroy: function() {
    if (this.state.observer) {
      this.state.observer.disconnect();
    }
    this.state.processedElements.clear();
  }
};
</script>

<script>
/**
 * WRGSMK Fancy Vert Module
 * Standalone fancy vertical background animations
 */

window.WRGSMK_FANCY_VERT = {
  
  SELECTORS: {
    FANCY_VERT: '.fancy-hl__vert'
  },

  CONFIG: {
    START_TRIGGER: "top bottom",
    END_OFFSET: "+=200%",
    BACKGROUND_POSITION: "500px 100px"
  },

  state: {
    scrollTriggerInstances: []
  },

  init: function() {
    const fancyVertElements = document.querySelectorAll(this.SELECTORS.FANCY_VERT);
    
    if (fancyVertElements.length === 0) return;

    fancyVertElements.forEach((el) => {
      const scrollTrigger = gsap.to(el, {
        scrollTrigger: {
          trigger: el,
          start: this.CONFIG.START_TRIGGER,
          end: this.CONFIG.END_OFFSET,
          scrub: true
        },
        backgroundPosition: this.CONFIG.BACKGROUND_POSITION,
        ease: "none"
      });

      this.state.scrollTriggerInstances.push(scrollTrigger.scrollTrigger);
    });
  },

  destroy: function() {
    this.state.scrollTriggerInstances.forEach(st => {
      if (st && st.kill) {
        st.kill();
      }
    });
    this.state.scrollTriggerInstances = [];
  }
};
</script>

<script>
/**
 * WRGSMK Home Page JavaScript
 */

const HOME_SELECTORS = {
  FLYIN: '.traya-flyin',
  FANCY_HEADLINE: '.fancy-section-headline',
  FULLSCREEN: '.fullscreen-section',
  CONTACT_FORM: '.contact-form',
  CONTACT_TITLE: '.contact-form__head h2',
  CONTACT_SUBTITLE: '.contact-form__head h3',
  CONTACT_CONTENT: '.contact-form__content',
  CONTACT_IMAGE: '.contact-form__img',
  SUBMIT_BTN: '.submit-btn',
  SCROLL_INDICATOR: '.scroll-indicator',
  FORM: 'form'
};

const HOME_CONFIG = {
  SCROLL_TRIGGERS: {
    WORK_START: "top 80%",
    WORK_END: "top 20%",
    CONTENT_START: "top 60%",
    CONTENT_END: "top 30%",
    FLYIN_START: "top 85%",
    FLYIN_END: "top 50%",
    HEADLINE_START: "bottom 85%"
  }
};

const HOME_MODULES = {
  
  setupHoverAnimations: (SELECTORS, CORE, UTILS) => {
    const fancyHeadlines = UTILS.getElements(SELECTORS.FANCY_HEADLINE);
    
    fancyHeadlines.forEach(section => {
      const arrow = section.querySelector('.arrow--fancy-section-headline');
      const text = section.querySelector('.fancy-hl__bottom');
      if (!arrow) return;
      
      UTILS.addManagedEventListener(section, 'mouseenter', () => {
        gsap.to(arrow, {
          rotation: '+=6',
          x: '-=4',
          duration: 0.266,
          ease: 'hover266',
          transformOrigin: 'center center',
          overwrite: true
        });
        
        gsap.to(text, {
        	color: '#490839',
          duration: 0.266,
          ease: 'hover266',
          overwrite: true
        });
      });
      
      UTILS.addManagedEventListener(section, 'mouseleave', () => {
        gsap.to(arrow, {
          rotation: '-=6',
          x: '+=4',
          duration: 0.266,
          transformOrigin: 'center center',
          ease: 'hover266',
          overwrite: true
        });
        
        gsap.to(text, {
        	color: '#f94500',
          duration: 0.266,
          ease: 'hover266',
          overwrite: true
        });
      });
    });
  },

  setupSectionPinning: (SELECTORS) => {
    const fancyHeadline = UTILS.getElement(SELECTORS.FANCY_HEADLINE);
    const fullscreenSection = UTILS.getElement(SELECTORS.FULLSCREEN);
    
    if (fancyHeadline && fullscreenSection) {
      ScrollTrigger.create({
        trigger: fancyHeadline,
        start: HOME_CONFIG.SCROLL_TRIGGERS.HEADLINE_START,
        endTrigger: fullscreenSection,
        end: "+=500",
        pin: false
      });
    }
  },

  setupFlyInAnimation: (SELECTORS) => {
    const flyInElement = UTILS.getElement(SELECTORS.FLYIN);
    if (!flyInElement) return;
    
    gsap.fromTo(flyInElement, 
      { yPercent: -100 },
      {
        yPercent: 0,
        ease: "circ.out",
        scrollTrigger: {
          trigger: flyInElement,
          start: HOME_CONFIG.SCROLL_TRIGGERS.FLYIN_START,
          end: HOME_CONFIG.SCROLL_TRIGGERS.FLYIN_END,
          scrub: 1,
          toggleActions: "play none none reverse"
        }
      }
    );
  },

  setupContactAnimations: (SELECTORS, CORE, UTILS, STATE) => {
    const workSection = UTILS.getElement(SELECTORS.CONTACT_FORM);
    const mainTitle = UTILS.getElement(SELECTORS.CONTACT_TITLE);
    const subtitle = UTILS.getElement(SELECTORS.CONTACT_SUBTITLE);
    const formGroups = UTILS.getElements(SELECTORS.CONTACT_CONTENT);
    const personImage = UTILS.getElement(SELECTORS.CONTACT_IMAGE);
    const submitBtn = UTILS.getElement(SELECTORS.SUBMIT_BTN);
    const contactForm = UTILS.getElement(SELECTORS.FORM);
    
    if (!workSection) return;

    gsap.timeline({
      scrollTrigger: {
        trigger: workSection,
        start: HOME_CONFIG.SCROLL_TRIGGERS.WORK_START,
        end: HOME_CONFIG.SCROLL_TRIGGERS.WORK_END,
        scrub: 1
      }
    })
    .to(workSection, {
      x: 0,
      opacity: 1,
      duration: 1,
      ease: "power2.out"
    });

    const contentTimeline = gsap.timeline({
      scrollTrigger: {
        trigger: workSection,
        start: HOME_CONFIG.SCROLL_TRIGGERS.CONTENT_START,
        end: HOME_CONFIG.SCROLL_TRIGGERS.CONTENT_END,
        scrub: 1
      }
    });
    
    if (mainTitle) {
      contentTimeline.from(mainTitle, {
        x: -50,
        opacity: 0,
        duration: 0.8,
        delay: 0.2
      });
    }
    
    if (subtitle) {
      contentTimeline.from(subtitle, {
        x: -30,
        opacity: 0,
        duration: 0.6,
        delay: 0.1
      }, "-=0.4");
    }
    
    if (formGroups.length > 0) {
      contentTimeline.from(formGroups, {
        x: -20,
        opacity: 0,
        duration: 0.5,
        stagger: 0.1,
        delay: 0.1
      }, "-=0.3");
    }
    
    if (personImage) {
      contentTimeline.from(personImage, {
        x: 50,
        opacity: 0,
        duration: 0.8,
        delay: 0.1
      }, "-=0.6");
    }
    
    if (contactForm && submitBtn) {
      UTILS.addManagedEventListener(contactForm, 'submit', (e) => {
        e.preventDefault();
        gsap.to(submitBtn, {
          scale: 0.95,
          duration: 0.1,
          yoyo: true,
          repeat: 1
        });
        alert('Nachricht gesendet! 📧');
      });
    }
  },

  setupScrollIndicator: (SELECTORS, CORE, UTILS, STATE) => {
    const scrollIndicator = UTILS.getElement(SELECTORS.SCROLL_INDICATOR);
    
    if (!scrollIndicator) return;

    UTILS.addManagedEventListener(window, 'scroll', () => {
      if (!STATE.hasScrolled && window.scrollY > 100) {
        STATE.hasScrolled = true;
        gsap.to(scrollIndicator, {
          opacity: 0,
          duration: 0.5
        });
      }
    });
  }
};

function initHomePage(SELECTORS, CORE, UTILS, STATE) {
  HOME_MODULES.setupHoverAnimations(SELECTORS, CORE, UTILS);
  HOME_MODULES.setupSectionPinning(SELECTORS);
  HOME_MODULES.setupFlyInAnimation(SELECTORS);
  HOME_MODULES.setupContactAnimations(SELECTORS, CORE, UTILS, STATE);
  HOME_MODULES.setupScrollIndicator(SELECTORS, CORE, UTILS, STATE);
}

window.WRGSMK_PAGE_CONFIG = {
  pageName: 'home',
  selectors: HOME_SELECTORS,
  init: initHomePage
};

document.addEventListener("DOMContentLoaded", () => {
  window.WRGSMK_INIT(window.WRGSMK_PAGE_CONFIG);
});
</script>

<script>
/**
 * WRGSMK Mouse Follower Module
 * Creates mouse-following hover effects for masonry image links with dynamic text
 */

window.WRGSMK_MOUSE_FOLLOWER = {
  
  SELECTORS: {
    CONTAINER: '.masonry--image--link',
    FOLLOWER: '.mouse-follower'
  },

  CONFIG: {
    POSITION_DURATION: 0.3,
    POSITION_EASE: "power2",
    SCALE_EASE: "power1.inOut"
  },

  state: {
    activeElements: []
  },

  setupMouseFollower: function(container) {
    const follower = container.querySelector(this.SELECTORS.FOLLOWER);
    
    if (!follower) return;

    // Get text from data attribute or link text
    const linkText = container.getAttribute('data-page-name') || 
                    container.getAttribute('data-link-text') ||
                    container.textContent.trim() ||
                    'View Project';

    // Set the follower text
    follower.textContent = linkText;

    // Initial setup: center follower and make it invisible
    gsap.set(follower, {
      xPercent: -50,
      yPercent: -50,
      scale: 0,
      opacity: 1
    });

    // Create smooth position animations
    const xTo = gsap.quickTo(follower, "x", { 
      duration: this.CONFIG.POSITION_DURATION, 
      ease: this.CONFIG.POSITION_EASE 
    });
    const yTo = gsap.quickTo(follower, "y", { 
      duration: this.CONFIG.POSITION_DURATION, 
      ease: this.CONFIG.POSITION_EASE 
    });

    // Create scale animation (paused by default)
    const scaleTween = gsap.to(follower, {
      scale: 1,
      ease: this.CONFIG.SCALE_EASE,
      paused: true
    });

    // Mouse event handlers
    const handleMouseEnter = () => scaleTween.play();
    const handleMouseLeave = () => scaleTween.reverse();
    const handleMouseMove = (e) => {
      xTo(e.offsetX);
      yTo(e.offsetY);
    };

    // Add event listeners
    container.addEventListener("mouseenter", handleMouseEnter);
    container.addEventListener("mouseleave", handleMouseLeave);
    container.addEventListener("mousemove", handleMouseMove);

    // Store element data for cleanup
    this.state.activeElements.push({
      container,
      follower,
      scaleTween,
      handlers: {
        mouseenter: handleMouseEnter,
        mouseleave: handleMouseLeave,
        mousemove: handleMouseMove
      }
    });
  },

  init: function() {
    const containers = gsap.utils.toArray(this.SELECTORS.CONTAINER);
    
    if (containers.length === 0) return;

    containers.forEach(container => {
      this.setupMouseFollower(container);
    });
  },

  destroy: function() {
    this.state.activeElements.forEach(({ container, scaleTween, handlers }) => {
      // Remove event listeners
      container.removeEventListener("mouseenter", handlers.mouseenter);
      container.removeEventListener("mouseleave", handlers.mouseleave);
      container.removeEventListener("mousemove", handlers.mousemove);
      
      // Kill GSAP animations
      if (scaleTween) {
        scaleTween.kill();
      }
    });

    this.state.activeElements = [];
  }
};
</script>
