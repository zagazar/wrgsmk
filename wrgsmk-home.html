<!-- WRGSMK Core und Module via jsDelivr laden -->
<script src="https://cdn.jsdelivr.net/gh/zagazar/wrgsmk/scripts/wrgsmk-core.js"></script>
<script src="https://cdn.jsdelivr.net/gh/zagazar/wrgsmk/scripts/wrgsmk-preloader.js"></script>
<script src="https://cdn.jsdelivr.net/gh/zagazar/wrgsmk/scripts/wrgsmk-horizontal-scroll.js"></script>
<script src="https://cdn.jsdelivr.net/gh/zagazar/wrgsmk/scripts/wrgsmk-img-grid.js"></script>
<script src="https://cdn.jsdelivr.net/gh/zagazar/wrgsmk/scripts/wrgsmk-fancy-vert.js"></script>

<script>
/**
 * WRGSMK Home Page JavaScript
 */

const HOME_SELECTORS = {
  FLYIN: '.traya-flyin',
  FANCY_HEADLINE: '.fancy-section-headline',
  FULLSCREEN: '.fullscreen-section',
  CONTACT_FORM: '.contact-form',
  CONTACT_TITLE: '.contact-form__head h2',
  CONTACT_SUBTITLE: '.contact-form__head h3',
  CONTACT_CONTENT: '.contact-form__content',
  CONTACT_IMAGE: '.contact-form__img',
  SUBMIT_BTN: '.submit-btn',
  SCROLL_INDICATOR: '.scroll-indicator',
  FORM: 'form'
};

const HOME_CONFIG = {
  SCROLL_TRIGGERS: {
    WORK_START: "top 80%",
    WORK_END: "top 20%",
    CONTENT_START: "top 60%",
    CONTENT_END: "top 30%",
    FLYIN_START: "top 85%",
    FLYIN_END: "top 50%",
    HEADLINE_START: "bottom 85%"
  }
};

const HOME_MODULES = {
  
  setupHoverAnimations: (SELECTORS, CORE, UTILS) => {
    const fancyHeadlines = UTILS.getElements(SELECTORS.FANCY_HEADLINE);
    
    fancyHeadlines.forEach(section => {
      const arrow = section.querySelector('.arrow--fancy-section-headline');
      if (!arrow) return;
      
      UTILS.addManagedEventListener(section, 'mouseenter', () => {
        gsap.to(arrow, {
          rotation: '+=6',
          x: '-=4',
          duration: 0.266,
          ease: 'hover266',
          transformOrigin: 'center center',
          overwrite: true
        });
      });
      
      UTILS.addManagedEventListener(section, 'mouseleave', () => {
        gsap.to(arrow, {
          rotation: '-=6',
          x: '+=4',
          duration: 0.266,
          transformOrigin: 'center center',
          ease: 'hover266',
          overwrite: true
        });
      });
    });
  },

  setupSectionPinning: (SELECTORS, UTILS) => {
    const fancyHeadline = UTILS.getElement(SELECTORS.FANCY_HEADLINE);
    const fullscreenSection = UTILS.getElement(SELECTORS.FULLSCREEN);
    
    if (fancyHeadline && fullscreenSection) {
      ScrollTrigger.create({
        trigger: fancyHeadline,
        start: HOME_CONFIG.SCROLL_TRIGGERS.HEADLINE_START,
        endTrigger: fullscreenSection,
        end: "+=500",
        pin: false
      });
    }
  },

  setupFlyInAnimation: (SELECTORS, UTILS) => {
    const flyInElement = UTILS.getElement(SELECTORS.FLYIN);
    if (!flyInElement) return;
    
    gsap.fromTo(flyInElement, 
      { yPercent: -100 },
      {
        yPercent: 0,
        ease: "circ.out",
        scrollTrigger: {
          trigger: flyInElement,
          start: HOME_CONFIG.SCROLL_TRIGGERS.FLYIN_START,
          end: HOME_CONFIG.SCROLL_TRIGGERS.FLYIN_END,
          scrub: 1,
          toggleActions: "play none none reverse"
        }
      }
    );
  },

  setupContactAnimations: (SELECTORS, CORE, UTILS, STATE) => {
    const workSection = UTILS.getElement(SELECTORS.CONTACT_FORM);
    const mainTitle = UTILS.getElement(SELECTORS.CONTACT_TITLE);
    const subtitle = UTILS.getElement(SELECTORS.CONTACT_SUBTITLE);
    const formGroups = UTILS.getElements(SELECTORS.CONTACT_CONTENT);
    const personImage = UTILS.getElement(SELECTORS.CONTACT_IMAGE);
    const submitBtn = UTILS.getElement(SELECTORS.SUBMIT_BTN);
    const contactForm = UTILS.getElement(SELECTORS.FORM);
    
    if (!workSection) return;

    gsap.timeline({
      scrollTrigger: {
        trigger: workSection,
        start: HOME_CONFIG.SCROLL_TRIGGERS.WORK_START,
        end: HOME_CONFIG.SCROLL_TRIGGERS.WORK_END,
        scrub: 1
      }
    })
    .to(workSection, {
      x: 0,
      opacity: 1,
      duration: 1,
      ease: "power2.out"
    });

    const contentTimeline = gsap.timeline({
      scrollTrigger: {
        trigger: workSection,
        start: HOME_CONFIG.SCROLL_TRIGGERS.CONTENT_START,
        end: HOME_CONFIG.SCROLL_TRIGGERS.CONTENT_END,
        scrub: 1
      }
    });
    
    if (mainTitle) {
      contentTimeline.from(mainTitle, {
        x: -50,
        opacity: 0,
        duration: 0.8,
        delay: 0.2
      });
    }
    
    if (subtitle) {
      contentTimeline.from(subtitle, {
        x: -30,
        opacity: 0,
        duration: 0.6,
        delay: 0.1
      }, "-=0.4");
    }
    
    if (formGroups.length > 0) {
      contentTimeline.from(formGroups, {
        x: -20,
        opacity: 0,
        duration: 0.5,
        stagger: 0.1,
        delay: 0.1
      }, "-=0.3");
    }
    
    if (personImage) {
      contentTimeline.from(personImage, {
        x: 50,
        opacity: 0,
        duration: 0.8,
        delay: 0.1
      }, "-=0.6");
    }
    
    if (contactForm && submitBtn) {
      UTILS.addManagedEventListener(contactForm, 'submit', (e) => {
        e.preventDefault();
        gsap.to(submitBtn, {
          scale: 0.95,
          duration: 0.1,
          yoyo: true,
          repeat: 1
        });
        alert('Nachricht gesendet! 📧');
      });
    }
  },

  setupScrollIndicator: (SELECTORS, CORE, UTILS, STATE) => {
    const scrollIndicator = UTILS.getElement(SELECTORS.SCROLL_INDICATOR);
    
    if (!scrollIndicator) return;

    UTILS.addManagedEventListener(window, 'scroll', () => {
      if (!STATE.hasScrolled && window.scrollY > 100) {
        STATE.hasScrolled = true;
        gsap.to(scrollIndicator, {
          opacity: 0,
          duration: 0.5
        });
      }
    });
  }
};

// Die Initialisierung übergibt UTILS als zweiten Parameter!
function initHomePage(SELECTORS, CORE, UTILS, STATE) {
  HOME_MODULES.setupHoverAnimations(SELECTORS, CORE, UTILS);
  HOME_MODULES.setupSectionPinning(SELECTORS, UTILS);
  HOME_MODULES.setupFlyInAnimation(SELECTORS, UTILS);
  HOME_MODULES.setupContactAnimations(SELECTORS, CORE, UTILS, STATE);
  HOME_MODULES.setupScrollIndicator(SELECTORS, CORE, UTILS, STATE);
}

window.WRGSMK_PAGE_CONFIG = {
  pageName: 'home',
  selectors: HOME_SELECTORS,
  init: initHomePage
};

document.addEventListener("DOMContentLoaded", () => {
  window.WRGSMK_INIT(window.WRGSMK_PAGE_CONFIG);
});
</script>
